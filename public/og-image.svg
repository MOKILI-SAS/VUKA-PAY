<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14110F"/>
      <stop offset="60%" stop-color="#1C1815"/>
      <stop offset="100%" stop-color="#241E1A"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FF6A2B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#14110F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#FFC21A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#14110F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Arrière-plan sombre haute fidélité -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glowGold)"/>

  <!-- Cadre subtil -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="#D9D0C6" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Symbole VUKA (Bracelet RFID) -->
  <g transform="translate(100, 160)">
    <circle cx="60" cy="65" r="42" stroke="#FF6A2B" stroke-width="14" stroke-linecap="round" stroke-dasharray="210 46" stroke-dashoffset="18" fill="none"/>
    <circle cx="60" cy="65" r="11" fill="#FFC21A"/>
  </g>

  <!-- Typographie Logo "vukapay" -->
  <text x="230" y="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="82" fill="#FBF6EE" letter-spacing="-2">vuka<tspan fill="#FF6A2B">pay</tspan></text>

  <!-- Badge officiel -->
  <g transform="translate(100, 310)">
    <rect width="400" height="42" rx="21" fill="#FF6A2B" fill-opacity="0.15" stroke="#FF6A2B" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="24" cy="21" r="5" fill="#FFC21A"/>
    <text x="40" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#FBF6EE" letter-spacing="1.5">BILLETTERIE &amp; CASHLESS ÉVÉNEMENTIEL</text>
  </g>

  <!-- Grand Titre -->
  <text x="100" y="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="46" fill="#FBF6EE" letter-spacing="-0.5">
    Payer en un geste. Partout.
  </text>
  <text x="100" y="475" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="24" fill="#D9D0C6">
    Festivals • Concerts • Salons • RDC • 100% Sans Contact NFC &amp; Mobile Money
  </text>

  <!-- Signature MOKILI SAS -->
  <g transform="translate(100, 535)">
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#7A7068">
      Propulsé par <tspan fill="#FF6A2B" font-weight="700">MOKILI SAS</tspan> • Kinshasa, RDC
    </text>
  </g>
</svg>
